name: Champagne CI

on:
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  guard-workspace-deps:
    name: guard-workspace-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run workspace dependency guard
        run: |
          set -euxo pipefail
          node scripts/guard-workspace-deps.mjs

  critical-paint-generated:
    name: critical-paint-generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable corepack + pnpm
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Install deps
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile
      - name: Check committed generated artefacts
        run: |
          set -euxo pipefail
          pnpm run check:critical-paint-generated
      - name: Run critical-paint generator tests
        run: |
          set -euxo pipefail
          node --test tests/champagne-critical-first-paint-generator.test.mjs
      - name: Prove write mode is byte-clean
        run: |
          set -euxo pipefail
          pnpm run generate:critical-paint
          git diff --exit-code -- \
            packages/champagne-tokens/styles/champagne/canvas-material.generated.css \
            packages/champagne-tokens/src/critical-paint.generated.ts

  guard-hero:
    name: guard-hero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable corepack + pnpm
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Install deps
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile
      - name: Run hero guard
        run: |
          set -euxo pipefail
          pnpm -w guard:hero

  guard-rogue-hex:
    name: guard-rogue-hex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable corepack + pnpm
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Install deps
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile
      - name: Run rogue hex guard
        run: |
          set -euxo pipefail
          pnpm -w guard:rogue-hex

  guard-canon:
    name: guard-canon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable corepack + pnpm
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Install deps
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile
      - name: Run canon guard
        run: |
          set -euxo pipefail
          pnpm -w guard:canon

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable corepack + pnpm
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Install deps
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile
      - name: Run lint
        run: |
          set -euxo pipefail
          pnpm -w lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable corepack + pnpm
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Install deps
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile
      - name: Run typecheck
        run: |
          set -euxo pipefail
          pnpm -w typecheck

  build-web:
    name: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable corepack + pnpm
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Install deps
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile
      - name: Build web workspace
        run: |
          set -euxo pipefail
          pnpm -w build:web

  stage-b-regression:
    name: stage-b-regression
    runs-on: ubuntu-latest
    env:
      ALLOW_CHAMPAGNE_ROUTES: "true"
      NEXT_PUBLIC_FEATURE_BRAND_HERO: "true"
      NEXT_PUBLIC_HERO_ENGINE: v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Enable corepack + pnpm
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Install dependencies
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile
      - name: Run Stage B contract guards
        run: |
          set -euxo pipefail
          pnpm exec vitest run \
            apps/web/app/_components/HeroMount.lifecycle-contract.test.ts \
            apps/web/app/components/layout/Header.navigation-contract.test.ts
      - name: Install Chromium
        run: |
          set -euxo pipefail
          pnpm exec playwright install --with-deps chromium
      - name: Build and start web workspace
        run: |
          set -euxo pipefail
          pnpm -w build:web
          pnpm --filter web start --hostname 127.0.0.1 --port 3000 \
            > "$RUNNER_TEMP/stage-b-web.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/stage-b-web.log"
          exit 1
      - name: Prove internal lab route is real HTML
        run: |
          set -euxo pipefail
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          curl --fail --silent --show-error \
            --dump-header "$headers_file" \
            --output "$body_file" \
            http://127.0.0.1:3000/champagne/sections-debug
          grep -Eiq '^content-type:[[:space:]]*text/html' "$headers_file"
          grep -Fq 'Sections Debugger' "$body_file"
      - name: Run Stage B Chromium regression matrix
        run: |
          set -euxo pipefail
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 \
            pnpm exec playwright test \
              tests/champagne-critical-first-paint.spec.ts \
              tests/champagne-surface-semantics.spec.ts \
              tests/hero-v2-navigation-continuity.spec.ts \
              --reporter=line \
              --workers=1
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage-b-web-log
          path: ${{ runner.temp }}/stage-b-web.log
          if-no-files-found: ignore

  verify:
    name: verify
    runs-on: ubuntu-latest
    needs:
      - guard-workspace-deps
      - critical-paint-generated
      - guard-hero
      - guard-rogue-hex
      - guard-canon
      - lint
      - typecheck
      - build-web
      - stage-b-regression
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable corepack + pnpm
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Install deps
        run: |
          set -euxo pipefail
          pnpm install --frozen-lockfile
      - name: Run verify
        run: |
          set -euxo pipefail
          pnpm -w verify
