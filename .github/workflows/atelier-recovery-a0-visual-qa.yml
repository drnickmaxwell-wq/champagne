name: Atelier Recovery A0 Visual QA

on:
  pull_request:
    paths:
      - "apps/web/app/champagne/atelier-recovery/**"
      - "apps/web/public/assets/champagne/design-lab/v27/**"
      - "apps/web/tests/atelier-recovery/**"
      - "apps/web/scripts/atelier-recovery/**"
      - ".github/workflows/atelier-recovery-a0-visual-qa.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-a0:
    name: recovery-a0-foundation-and-visual-truth
    runs-on: ubuntu-latest
    env:
      ALLOW_CHAMPAGNE_ROUTES: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Enable pnpm
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate A0 manifests and contracts
        run: |
          set -euxo pipefail
          pnpm atelier:a0:check
          pnpm atelier:a0:test
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and start recovery route
        run: |
          set -euxo pipefail
          pnpm build:web
          pnpm --filter web start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/atelier-a0-web.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/champagne/atelier-recovery > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/atelier-a0-web.log"
          exit 1
      - name: Capture semantic recovery evidence
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          ATELIER_A0_EVIDENCE_DIR: ${{ runner.temp }}/atelier-a0-evidence
        run: pnpm atelier:a0:visual-qa
      - name: Upload A0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atelier-recovery-a0-render-evidence
          path: |
            ${{ runner.temp }}/atelier-a0-evidence
            ${{ runner.temp }}/atelier-a0-web.log
          if-no-files-found: warn
