name: Atelier Recovery A1 + A2 + A2R + A2F Visual QA

on:
  pull_request:
    paths:
      - "apps/web/app/champagne/atelier-recovery/**"
      - "apps/web/public/assets/champagne/design-lab/v27/**"
      - "apps/web/tests/atelier-recovery/**"
      - "apps/web/scripts/atelier-recovery/**"
      - ".github/workflows/atelier-recovery-a0-visual-qa.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-a1:
    name: recovery-a1-a2-a2r-a2f-contract-and-visual-truth
    runs-on: ubuntu-latest
    env:
      ALLOW_CHAMPAGNE_ROUTES: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Enable pnpm
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate inherited A0, closed A1 and A2 contracts
        run: |
          set -euxo pipefail
          pnpm atelier:a0:check
          pnpm atelier:a0:test
          pnpm atelier:a1:check
          pnpm atelier:a1:test
          pnpm atelier:a2:check
          pnpm atelier:a2:test
          pnpm atelier:a2r:test
          pnpm atelier:a2f:test
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and start recovery route
        run: |
          set -euxo pipefail
          pnpm build:web
          pnpm --filter web start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/atelier-a1-production.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/champagne/atelier-recovery > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/atelier-a1-production.log"
          exit 1
      - name: Exercise A1 review and capture visual evidence
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          ATELIER_A1_EVIDENCE_DIR: ${{ runner.temp }}/atelier-a1-evidence
        run: pnpm atelier:a1:visual-qa
      - name: Exercise A2F source fidelity workbench and capture comparison evidence
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          ATELIER_A2F_EVIDENCE_DIR: ${{ runner.temp }}/atelier-a2f-evidence
        run: pnpm atelier:a2f:visual-qa
      - name: Prove explicit local persistence and restore canonical seed
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
          ATELIER_A1_EVIDENCE_DIR: ${{ runner.temp }}/atelier-a1-evidence
        run: |
          set -euxo pipefail
          dataset="apps/web/app/champagne/atelier-recovery/data/preferences/founder-visual-preferences.v1.json"
          backup="$RUNNER_TEMP/founder-visual-preferences.rev558.json"
          cp "$dataset" "$backup"
          env -u CI \
            ALLOW_CHAMPAGNE_ROUTES=true \
            CHAMPAGNE_ATELIER_LOCAL_WORK_MODE=A1_EXPLICIT_WRITE \
            ATELIER_WORKTREE_FILE_PERSISTENCE=ENABLED \
            pnpm --filter web dev --hostname 127.0.0.1 --port 3001 > "$RUNNER_TEMP/atelier-a1-persistence.log" 2>&1 &
          server_pid=$!
          restore_seed() {
            kill "$server_pid" 2>/dev/null || true
            cp "$backup" "$dataset"
          }
          trap restore_seed EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/champagne/atelier-recovery > /dev/null; then
              break
            fi
            if [[ "$attempt" == "60" ]]; then
              cat "$RUNNER_TEMP/atelier-a1-persistence.log"
              exit 1
            fi
            sleep 1
          done
          PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")" \
            pnpm atelier:a1:persistence-qa
          restore_seed
          trap - EXIT
          pnpm atelier:a1:check
          pnpm atelier:a2:check
          git diff --exit-code -- "$dataset"
      - name: Upload A1 and A2F evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atelier-recovery-a1-a2f-render-evidence
          path: |
            ${{ runner.temp }}/atelier-a1-evidence
            ${{ runner.temp }}/atelier-a2f-evidence
            ${{ runner.temp }}/atelier-a1-production.log
            ${{ runner.temp }}/atelier-a1-persistence.log
          if-no-files-found: warn
